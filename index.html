  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('recanto-theme');
          if (theme === 'dark' || (!theme)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
